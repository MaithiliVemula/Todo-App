<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header>
            <h1>My To-Do List</h1>
            <p class="subtitle" id="summary">Loading…</p>
        </header>

        <form id="todo-form" autocomplete="off">
            <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="200" required>
            <button type="submit">Add</button>
        </form>
        <p class="error" id="error" hidden></p>

        <nav class="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="active">Active</button>
            <button class="filter" data-filter="completed">Completed</button>
        </nav>

        <ul id="todo-list"></ul>
        <p class="empty" id="empty" hidden>Nothing here. Add a task above.</p>

        <footer>
            <button id="clear-completed" class="link">Clear completed</button>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
