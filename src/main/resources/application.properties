# Hosting platforms like Render tell the app which port to use through the PORT
# environment variable. Locally there is no PORT, so it falls back to 8080.
server.port=${PORT:8080}

# Database settings. Locally this uses an H2 file (./data/tododb).
# In the cloud you can point it at a free Postgres database by setting
# DATABASE_URL, DATABASE_USERNAME and DATABASE_PASSWORD (see README).
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/tododb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Print the SQL Hibernate runs (handy while learning). Turned off in the Docker image.
spring.jpa.show-sql=${SHOW_SQL:true}

# Browse the database at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/tododb   user: sa   password: (blank)
# Turned off in the Docker image so nobody can open your database on the public URL.
spring.h2.console.enabled=${H2_CONSOLE:true}
